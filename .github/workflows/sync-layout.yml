name: Sync layout

on:
  workflow_dispatch:
  schedule:
    # Run at 00:00 UTC daily
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync:
    strategy:
      matrix:
        include:
          - geometry: "voyager"
            id: "Lm4R0"
          - geometry: "voyager"
            id: "Qx0lg"
      # Concurrency mitigation: sequential execution prevents git push merge conflicts
      max-parallel: 1
      fail-fast: false

    uses: ./.github/workflows/fetch-layout.yml
    with:
      layout_id: ${{ matrix.id }}
      layout_geometry: ${{ matrix.geometry }}
